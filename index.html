<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learn - interactive illustrations of how technology works</title>
    <meta name="description" content="In-depth, animated, interactive illustrations of tech concepts." />
    <meta property="og:title" content="Learn" />
    <meta property="og:description" content="In-depth, animated, interactive illustrations of tech concepts." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint to avoid a flash. Mirrors src/lib/theme.svelte.js.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This site is made of interactive illustrations and needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
